# ==============================================================================
# FTTH GPON OLT Production Configuration Script
# Generated automatically via NetDevOps ISP Automation Engine
# Hostname: isp-gpon-olt01 | Site: ISP-POP-Gulshan
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. System Identity & Out-of-Band Management
# ------------------------------------------------------------------------------
sysname isp-gpon-olt01

# Management VLAN & IP Interface
vlan 10
 description Management-Network
 quit

interface vlanif 10
 ip address 10.10.1.10 255.255.255.0
 description Out-of-Band OLT Management
 quit

ip route-static 0.0.0.0 0.0.0.0 10.10.1.1

# ------------------------------------------------------------------------------
# 2. Service VLANs (Broadband, Hotspot, Corporate)
# ------------------------------------------------------------------------------
vlan 10
 description Service-VLAN-10
 quit
vlan 100
 description Service-VLAN-100
 quit
vlan 200
 description Service-VLAN-200
 quit
vlan 300
 description Service-VLAN-300
 quit

# Uplink 10GE Trunk Port
interface ge1
 port link-type trunk
 port trunk allow-pass vlan 10 100 200 300
 description Uplink-to-Core-BNG-Router
 quit

# ------------------------------------------------------------------------------
# 3. Dynamic Bandwidth Allocation (DBA) Profiles
# ------------------------------------------------------------------------------
dba-profile add profile-id 10 profile-name "DBA-Broadband-BestEffort" type4 max 1024000
dba-profile add profile-id 20 profile-name "DBA-Corporate-CIR" type1 fix 102400

# ------------------------------------------------------------------------------
# 4. ONT Line Profile & Service Profile Templates
# ------------------------------------------------------------------------------
ont-lineprofile gpon profile-id 10 profile-name "LineProfile-FTTH-Broadband"
 tcont 1 dba-profile-id 10
 gem add 1 eth tcont 1
 gem mapping 1 1 vlan 100
 commit
 quit

ont-srvprofile gpon profile-id 10 profile-name "SrvProfile-FTTH-Standard"
 ont-port eth 4
 port vlan eth 1 translation 100 user-vlan 100
 commit
 quit

# ------------------------------------------------------------------------------
# 5. PON Optical Ports & Auto-Find Discovery
# ------------------------------------------------------------------------------
# --- PON Port 0/1: Gulshan-Zone-A (VLAN 100) ---
interface gpon 0/1
 description Gulshan-Zone-A
 port ont-auto-find enable
 quit
# --- PON Port 0/2: Gulshan-Zone-B (VLAN 100) ---
interface gpon 0/2
 description Gulshan-Zone-B
 port ont-auto-find enable
 quit
# --- PON Port 0/3: Commercial-Zone (VLAN 100) ---
interface gpon 0/3
 description Commercial-Zone
 port ont-auto-find enable
 quit
# --- PON Port 0/4: Campus-WiFi-Zone (VLAN 200) ---
interface gpon 0/4
 description Campus-WiFi-Zone
 port ont-auto-find enable
 quit

# ------------------------------------------------------------------------------
# 6. SNMP Telemetry & Optical Monitoring (dBm)
# ------------------------------------------------------------------------------
snmp-agent
snmp-agent community read isp-monitor
snmp-agent sys-info location ISP-POP-Gulshan
snmp-agent sys-info contact noc@cloudapex.net

# ==============================================================================
# GPON OLT configuration rendered successfully.
# ==============================================================================