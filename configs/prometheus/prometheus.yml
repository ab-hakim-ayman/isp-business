global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "isp-mikrotik-exporter"
    static_configs:
      - targets: ["isp-mikrotik-exporter:9436"]
        labels:
          environment: "production"
          organization: "isp-business"
          service: "core-bng-routing"
