# ==============================================================================
# Docker Compose Stack for ISP Business Observability & Telemetry
# Includes Prometheus, Grafana, and MikroTik RouterOS Exporter
# ==============================================================================
---
services:
  isp-prometheus:
    image: prom/prometheus:latest
    container_name: isp-prometheus
    restart: unless-stopped
    ports:
      - "9092:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - isp-prometheus-data:/prometheus

  isp-grafana:
    image: grafana/grafana:latest
    container_name: isp-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./configs/grafana/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./configs/grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./configs/grafana/dashboards/isp-network-overview.json:/var/lib/grafana/dashboards/isp-network-overview.json:ro
      - isp-grafana-data:/var/lib/grafana

  isp-mikrotik-exporter:
    image: nshttpd/mikrotik-exporter:1.0.11
    container_name: isp-mikrotik-exporter
    restart: unless-stopped
    environment:
      CONFIG_FILE: /etc/mikrotik-exporter/config.yml
    ports:
      - "9437:9436"
    volumes:
      - ./configs/mikrotik-exporter/config.yml:/etc/mikrotik-exporter/config.yml:ro

volumes:
  isp-prometheus-data:
  isp-grafana-data:
