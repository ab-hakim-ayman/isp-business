name: ISP Business CI-CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pre-check:
    name: Validation, Schema & Config Generation
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Vault Password
        run: |
          if [ -f "$HOME/.vault_pass" ]; then
            cp "$HOME/.vault_pass" .vault_pass
          elif [ -n "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" ]; then
            echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          fi
          chmod 600 .vault_pass 2>/dev/null || true

      - name: Run YAML Linting
        run: |
          yamllint .

      - name: Validate ISP Schema with Pydantic
        run: |
          python3 scripts/validate_isp_schema.py

      - name: Pre-Deployment Control-Plane & Peering Verification (Batfish)
        run: |
          python3 scripts/verify_batfish.py

      - name: Test Configuration Generation
        run: |
          python3 scripts/generate_isp_configs.py

      - name: ISP Deploy Ansible Syntax Check
        run: |
          ansible-playbook playbooks/deploy_isp.yml --syntax-check

      - name: ISP Verify Playbook Syntax Check
        run: |
          ansible-playbook playbooks/verify_subscribers.yml --syntax-check

  deploy-to-isp:
    name: Live ISP Network Deployment & Verification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Vault Password
        run: |
          if [ -f "$HOME/.vault_pass" ]; then
            cp "$HOME/.vault_pass" .vault_pass
          elif [ -n "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" ]; then
            echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          fi
          chmod 600 .vault_pass 2>/dev/null || true

      - name: Deploy ISP Network via Ansible
        run: |
          ansible-playbook playbooks/deploy_isp.yml

      - name: Post-Deployment Concurrent Audit via Nornir & Scrapli
        run: |
          python3 scripts/nornir_isp_exec.py

      - name: Model-Driven Streaming Telemetry (gNMI & YANG)
        run: |
          python3 scripts/gnmi_isp_telemetry.py
